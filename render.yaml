# Versión web de SuperShop en Render (https://render.com).
# Un solo servicio: el backend compila y sirve también el frontend.
# La base de datos vive en Turso (SQLite en la nube); ver docs/DESPLIEGUE-WEB.md.
services:
  - type: web
    name: supershop
    runtime: node
    plan: free
    region: virginia
    # Se instalan también las dependencias de desarrollo del frontend (Vite, TypeScript)
    # porque NODE_ENV=production haría que npm las omitiera.
    buildCommand: cd frontend && npm ci --include=dev && npm run build && cd ../backend && npm ci --omit=dev
    startCommand: cd backend && node src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render termina el HTTPS y reenvía la petición: hay que confiar en su proxy.
      - key: TRUST_PROXY
        value: "true"
      - key: LOCAL_HTTPS
        value: "false"
      # Se piden al crear el servicio (no se guardan en este archivo):
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
